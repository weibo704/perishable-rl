# Core matrix (docs/EXPERIMENTS.md). Seeds and train_env_steps default to configs/budget.yaml.
# Deterministic references run once (seed 0). Builders: perinv.runner.DEFAULT_BUILDERS.
budget: configs/budget.yaml
groups:
  A:
    envs: [configs/env/n1_k06.yaml, configs/env/n1_k10.yaml]
    policies:
      - ppo
      - a2c
      - sac
      - dqn
      - maskppo
      - {name: dp, seeds: [0]}
      - {name: ss, seeds: [0]}
      - {name: newsvendor, seeds: [0]}
      - {name: ss_h, seeds: [0]}           # horizon-aware: no orders in the last τ days
      - {name: newsvendor_h, seeds: [0]}   # horizon-aware: no orders in the last τ days
  B:
    envs: [configs/env/n2_k06.yaml, configs/env/n2_k10.yaml, configs/env/n5_k06.yaml, configs/env/n5_k10.yaml]
    policies:
      - ppo
      - a2c
      - sac
      - {name: ss, seeds: [0]}
      - {name: newsvendor, seeds: [0]}
      - {name: ss_h, seeds: [0]}           # horizon-aware: no orders in the last τ days
      - {name: newsvendor_h, seeds: [0]}   # horizon-aware: no orders in the last τ days
